<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hồ sơ & Liên hệ</title>
</head>
<body>

  <header>
    <h1>Hồ sơ cá nhân</h1>
    <nav>
      <a href="#about">Giới thiệu</a> |
      <a href="#skills">Kỹ năng</a> |
      <a href="#contact">Liên hệ</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>Giới thiệu</h2>
      <img src="https://via.placeholder.com/100" alt="Avatar" width="100">
      <p>Lập trình viên web định hướng phát triển backend và fullstack.</p>
    </section>

    <section id="skills">
      <h2>Kỹ năng</h2>
      <ul>
        <li>HTML, CSS, JavaScript</li>
        <li>Python, C, SQL</li>
      </ul>
    </section>

    <section id="contact">
      <h2>Liên hệ</h2>
      <form action="#" method="POST">
        <p>
          <label for="name">Họ tên:</label><br>
          <input type="text" id="name" name="name" required>
        </p>
        <p>
          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email" required>
        </p>
        <p>
          <label for="msg">Tin nhắn:</label><br>
          <textarea id="msg" name="msg" rows="3" required></textarea>
        </p>
        <button type="submit">Gửi</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Lê Văn Hùng</p>
  </footer>

</body>
</html>
